<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Food Counter: Have We Got?</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9b8;--ink:#4a2a12;--card:#fff;--line:#ffc94d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#3a2414;--ink:#fff1d6;--card:#5a3a22;--line:#c58d3a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,Arial,sans-serif;min-height:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation}.hide{display:none!important}
.screen{min-height:100svh;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 50% 0,#ffe08a,transparent 70%)}
.panel,.card{background:var(--card);border:4px solid var(--line);border-radius:26px;box-shadow:0 6px #c58d3a;padding:16px;text-align:center;width:min(100%,520px)}
.logo{width:min(70%,280px)}.duo{display:flex;justify-content:center;align-items:flex-end;gap:6px}.duo img{height:clamp(130px,34vw,190px);animation:bob 1.4s ease-in-out infinite}.duo img+img{animation-delay:.4s}
.sb{background:#fff;border:3px solid #e8d49a;border-radius:18px;padding:8px 12px;font-weight:800;color:#3a4a7a;max-width:230px;text-align:left;margin-bottom:30px}
.btn{border:3px solid #fff;border-radius:16px;background:#3fc974;color:#fff;font-weight:800;padding:12px 18px;min-height:48px;box-shadow:0 5px #14803f;text-shadow:0 2px #0004}.btn:active{transform:translateY(4px);box-shadow:0 1px #14803f}.btn.y{background:#ffc82e;color:#5a2d12;box-shadow:0 5px #b8820a;text-shadow:none}
.inp{width:100%;padding:12px;border:3px solid #9fb6e8;border-radius:12px;font:inherit;margin:8px 0;background:#fff;color:#223}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;font-size:12px;font-weight:800}.how i{display:block;font-size:30px;font-style:normal}
#play{max-width:560px;margin:auto;padding:8px}.hud{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:8px}.chip{background:#2f5fc8;color:#fff;border:2px solid #fff;border-radius:14px;padding:5px 9px;font-size:13px;font-weight:800;box-shadow:0 3px #1c3b8a}
.scene{border:4px solid #fff;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 6px #c58d3a;background:#444}
.wall{position:relative;height:clamp(240px,60vw,330px);background:center/cover}
.cust{position:absolute;bottom:-12px;width:33%;left:124%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 1s cubic-bezier(.5,.1,.3,1),filter .5s;z-index:1}.cust.dim{filter:brightness(.82) saturate(.9)}
.bub{position:relative;background:#fff;border:3px solid #cfd8f0;border-radius:18px;padding:6px 8px;margin-bottom:12px;width:100%;max-width:190px;text-align:center;font-weight:800;font-size:clamp(11px,3vw,18px);line-height:1.15;color:#2a3a6a;opacity:0;transform:scale(.3);transform-origin:50% 100%;transition:.45s cubic-bezier(.3,1.6,.5,1);box-shadow:0 4px #0003}
.bub::after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-9px;border:9px solid transparent;border-top:12px solid #cfd8f0;border-bottom:0}
.cust.show .bub{opacity:1;transform:scale(1)}.cust.front .bub{border-color:#ffb300;animation:glow 1.4s infinite}.cust.front .bub::after{border-top-color:#ffb300}
.sp{height:clamp(100px,28vw,170px);transform-origin:50% 100%;filter:drop-shadow(0 4px 2px #0004)}
.walk .sp{animation:walk .32s ease-in-out infinite}.happy .sp{animation:hop .5s ease-out 2}.sad .sp{animation:shake .5s ease-in-out}
.pt{height:8px;background:#0002;border-radius:9px;margin-top:5px;overflow:hidden}.pt i{display:block;height:100%;width:100%;background:#3fc974;transition:width .1s linear,background .3s}
.md{position:absolute;top:-17px;right:-10px;font-size:clamp(22px,5.5vw,32px);filter:drop-shadow(0 2px 0 #0004);animation:bob .8s infinite}.cust:not(.front) .pt,.cust:not(.front) .md{display:none}
.shelf{position:relative;z-index:3;margin-top:-10px;aspect-ratio:712/576;background-size:100% 100%}
.fi{position:absolute;width:14.5%;transform:translate(-50%,-50%);animation:pop .4s backwards;z-index:2;transition:.3s}.fi img{width:100%;display:block;filter:drop-shadow(0 3px 2px #0006)}
.fi.no img{filter:grayscale(1) brightness(.6);opacity:.65}.fi.no::after{content:"SOLD OUT";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-10deg);white-space:nowrap;background:#e4474c;color:#fff;border:2px solid #fff;font-size:clamp(7px,2vw,11px);font-weight:900;padding:1px 5px}
.fi.ring{transform:translate(-50%,-50%) scale(1.18)}.fi.ring img{filter:drop-shadow(0 0 7px #3fe27a) drop-shadow(0 0 3px #fff)}.fi.ring.no img{filter:grayscale(1) drop-shadow(0 0 7px #ff4d57)}
.lb{position:absolute;width:13%;height:6.6%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:clamp(6px,1.9vw,10px);font-weight:800;line-height:1;text-align:center;color:#5a2d12;text-transform:capitalize;z-index:2}
.rx{position:absolute;right:2%;top:3%;z-index:5;text-align:center;opacity:0;pointer-events:none}.rx.on{animation:rx 1.8s}.rx img{height:clamp(70px,20vw,110px);filter:drop-shadow(0 4px 3px #0005)}
.rx b{display:block;font-size:clamp(14px,4vw,22px);color:#fff;text-shadow:0 2px #0006;padding:0 10px;border-radius:12px;border:2px solid #fff}.rx b.g{background:#3fc974}.rx b.r{background:#e4474c}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}.ans{min-height:62px;border:4px solid #fff;border-radius:18px;background:#3fc974;color:#fff;text-shadow:0 2px #0005;font-size:clamp(15px,4vw,21px);font-weight:900;box-shadow:0 5px #14803f;padding:6px}.ans.n{background:#ff4d57;box-shadow:0 5px #a8222e}.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px #0003}.ans:disabled{opacity:.55}
.fb{text-align:center;font-weight:900;min-height:28px;font-size:16px}.g{color:#14803f}.b{color:#d52d3c}.bar{height:10px;background:#0002;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#3fc974;transition:width .6s}
.coin{position:fixed;z-index:20;font-size:28px;pointer-events:none;transition:transform .9s cubic-bezier(.4,-.4,.7,1);filter:drop-shadow(0 2px 2px #0006)}.bump{animation:bump .35s}
.modal{position:fixed;inset:0;background:#1a2a5acc;z-index:9;display:grid;place-items:center;padding:10px}.card{max-height:95svh;overflow:auto}.card img{height:120px}.ttl{background:#4b4bc8;color:#fff;border-radius:14px;padding:6px;font-weight:900;margin:6px 0}
table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:5px;font-size:13px;border-bottom:1px solid var(--line)}tr.me{background:#fff0a0;color:#4a2a12;font-weight:800}
